const ICON={bolt:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',gauge:'<path d="M12 14l4-4"/><path d="M3.3 17a10 10 0 1 1 17.4 0"/>',inbox:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',plus:'<path d="M12 5v14M5 12h14"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'};

const THEME={get(){try{return localStorage.getItem('ig_tema')||''}catch(e){return''}},set(v){try{localStorage.setItem('ig_tema',v)}catch(e){}}};

const f2=x=>(Math.round(x*100)/100).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:2});
let tmr;function debounce(fn,ms=400){clearTimeout(tmr);tmr=setTimeout(fn,ms)}

/* ================= definisi form (data-driven) ================= */
const BR=['Baik','Rusak'];

// item "klik 2": dua kelompok pilihan (mis. Ada/Tidak ada + Nyala/Tidak nyala). Jika kelompok 1 = "Tidak ada", kelompok 2 tidak perlu diisi.
const ADA_NYALA=[['Ada','Tidak ada'],['Nyala','Tidak nyala']];

const AREAS=['Nagoya','Tiban','Batu Aji','Batam Center'];
const FORMS={
 tiang:{judul:'Inspeksi Gardu Tiang',no:'FM-bright-SBU-DIST-02-08',rev:'03',tgl:'2022-06-02',groups:[
  {g:'TIANG',items:[{t:'Keadaan',o:['Baik','Retak/keropos','Miring']},{t:'Cat (untuk tiang besi)',o:CAT},{t:'No. tiang',o:['Baik','Buram','Tidak ada']},{t:'Pondasi tiang',o:['Baik','Rusak minor','Rusak mayor','Kotor/semak']}]},
  {g:'SALURAN TM',items:[{t:'Keadaan isolator',o:['Baik','Kotor','Miring','Rusak']},{t:'Kabel TM: terminating akhir luar',o:BR},{t:'Kabel TM: pengaman mekanis',o:BR}]},
  {g:'TRAFO 20kV',items:[{t:'Level minyak',o:['Penuh','Tidak penuh']},{t:'Kebocoran minyak trafo',o:OIL},{t:'Seal body trafo',o:OIL},{t:'Seal bushing TM/TR',o:OIL},{t:'Bushing trafo sisi TM/TR',o:BR},{t:'Kondisi fisik trafo',o:FISIK}]},
  {g:'ARRESTER',items:[{t:'Kondisi fisik',o:BR},{t:'Kontinuitas',o:['Baik','Tidak baik'],extra:'Nilai'},{t:'Sambungan kabel',o:BR}]},
  {g:'CUT OUT',items:[{t:'Kondisi fisik',o:BR},{t:'Sambungan kabel',o:BR}]},
  {g:'PANEL TR',items:[{t:'Fuse base',o:FUSEBASE},{t:'Kesesuaian ampere fuse TR',o:FUSEAMP},{t:'Sambungan busbar',o:BUSBAR},{t:'Single core TR',o:SCTR},{t:'Cat panel',o:CAT}]},
  {g:'KABEL TR',items:[{t:'Terminating akhir luar',o:BR},{t:'Sambungan TR',o:BR}]},
  {g:'GROUNDING',items:[{t:'Grounding',ohm:'Nilai ukur grounding (Ω)',o:['Kabel lengkap','Kabel hilang','Tahanan tinggi']}]}
 ]},
 beton:{judul:'Inspeksi Gardu Beton',no:'FM-bright-SBU-DIST-02-07',rev:'03',tgl:'2022-06-02',groups:[
  {g:'TRAFO 20kV',tmNA:true,items:[{t:'Level minyak',o:['Penuh','Tidak penuh']},{t:'Kebocoran minyak',o:OIL},{t:'Seal body trafo',o:OIL},{t:'Seal bushing TM/TR',o:OIL},{t:'Bushing TM/TR',o:['Baik','Panas berlebih/rusak']},{t:'Kondisi fisik trafo',o:FISIK}]},
  {g:'KUBIKEL 20kV',items:[{t:'Busbar',o:['Baik','Corona']},{t:'Terminasi (ID) TM',o:['Baik','Rusak isolasinya']},{t:'Heater',o:['Baik','Rusak','Tidak ada','Tidak ada / Fully']},{t:'Body',o:BR},{t:'Lampu indikator',o:BR},{t:'Fuse TM',o:['Baik','Rusak jumperan']}]},
  {g:'PANEL TR',tmNA:true,items:[{t:'Fuse base',o:FUSEBASE},{t:'Kesesuaian ampere fuse TR',o:FUSEAMP},{t:'Sambungan busbar',o:BUSBAR},{t:'Single core TR',o:SCTR}]},
  {g:'EFI',items:[{t:'Lampu indikator',dua:ADA_NYALA},{t:'Power suplai & instalasi',dua:ADA_NYALA}]},
  {g:'BANGUNAN & PAGAR',items:[{t:'Duck atap',o:ATAP},{t:'Lantai kerja dalam',o:LANTAI},{t:'Lantai rabat luar',o:LANTAI},{t:'Cat bangunan',o:CAT},{t:'Duck kabel TM/TR',o:DUCK},{t:'Ventilasi',o:VENT},{t:'Lamp & instalasi',o:BR},{t:'Pagar bangunan',dua:ADA_BAIK},{t:'Cat pagar',o:CAT},{t:'Engsel pintu gardu',o:BR},{t:'Dudukan gembok gardu',o:BR},{t:'Lingkungan gardu',o:['Bersih','Kotor']},{t:'Exhaust fan',dua:ADA_BAIK},{t:'Suhu dalam gardu',o:['Panas','Lembab']}]},
  {g:'GROUNDING',items:[{t:'Grounding',ohm:'Nilai ukur grounding (Ω)',o:['Kabel lengkap','Kabel hilang','Tahanan grounding tinggi']}]}
 ]},
 beban:{judul:'Pengukuran Beban Trafo',no:'FM-bright-SBU-DIST-02-11',rev:'0',tgl:'2020-09-16'}
};

for(const k of['tiang','beton']){let n=0;for(const g of FORMS[k].groups)for(const it of g.items){it.n=++n;if(it.dua){it.o=it.dua.flat();it.ok=[0,it.dua[0].length]}else if(!it.ok)it.ok=[0];}}
// jawaban item: plain => a.v ; klik-2 => a.p=[v1,v2] dan a.v = gabungan ("Ada + Nyala" / "Tidak ada")
function ansV(it,a){if(!it.dua)return a.v||'';const p=a.p||[];if(!p[0])return'';if(p[0]===it.dua[0][1])return p[0];return p[1]?p[0]+' + '+p[1]:''}
function badOf(it,a){const v=ansV(it,a);if(!v)return false;if(!it.dua)return!it.ok.includes(it.o.indexOf(v));const p=a.p||[];const ps=p[0]===it.dua[0][1]?[p[0]]:p;return ps.some(x=>x&&!it.ok.includes(it.o.indexOf(x)))}
const HEALTH=['Baik','Cukup','Kurang','Buruk'];

/* ================= IndexedDB ================= */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('inspeksi-gardu',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('records',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'pid'}).createIndex('rid','rid');d.createObjectStore('meta');};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const out=fn(t.objectStore(store));t.oncomplete=()=>res(out&&'result'in out?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbPut=(s,v,k)=>dbx(s,'readwrite',o=>o.put(v,k));
const dbGet=(s,k)=>dbx(s,'readonly',o=>o.get(k));
const dbAll=s=>dbx(s,'readonly',o=>o.getAll());
const dbDel=(s,k)=>dbx(s,'readwrite',o=>o.delete(k));
const photosOf=rid=>dbx('photos','readonly',o=>o.index('rid').getAll(rid));

/* ================= state ================= */
const S={tugas:[],records:[],petugas:'',area:''};
async function loadState(){S.tugas=(await dbGet('meta','tugas'))||[];S.petugas=(await dbGet('meta','petugas'))||'';S.area=(await dbGet('meta','area'))||'';S.records=await dbAll('records')}
const saveTugas=()=>dbPut('meta',S.tugas,'tugas');
const saveRec=r=>{r.updated=new Date().toISOString();return dbPut('records',r)};

/* ================= GPS ================= */
function getGps(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),ts:new Date().toISOString()}),()=>res(null),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}

 if(!rec.gps&&!confirm('GPS belum terambil. Tetap selesaikan tanpa koordinat?'))return;
 if(!confirm('Selesaikan & kunci inspeksi ini? Setelah dikunci hanya bisa dikoreksi lewat revisi.'))return;
 const dn=new Date(),p2=n=>String(n).padStart(2,'0');rec.jam=p2(dn.getHours())+':'+p2(dn.getMinutes());
 if(rec.form==='beban'){const u=rec.beban.ukur;if(!u.pukul)u.pukul=rec.jam;if(!u.waktu)u.waktu=(dn.getHours()>=6&&dn.getHours()<18)?'Siang':'Malam';rec.beban.tgl_laporan=today()}
 rec.status='selesai';rec.selesaiAt=dn.toISOString();await saveRec(rec);
 if(rec.form!=='beban'&&!rec.tm&&!bebanOk(rec.gardu.id)&&confirm('Inspeksi tersimpan.\nUkur beban trafo WAJIB diisi untuk gardu non-TM dan belum ada. Isi sekarang?'))return openGardu(tugasOf(rec),'beban')
 renderHome()}

/* ================= paket zip ================= */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;const d=new Date();const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);parts.push(new Uint8Array(lh.buffer),nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz}
 let cdl=0;for(const c of cd)cdl+=c.length;const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function buildPackage(recs){const enc=new TextEncoder(),files=[],man={format:'inspeksi-gardu-paket',versi:1,dibuat:new Date().toISOString(),petugas:S.petugas,items:[]};
 for(const r of recs){const pm=[];for(const p of await photosOf(r.id)){const u8=new Uint8Array(await p.blob.arrayBuffer());const fn=`foto/${r.id}/${p.pid}.jpg`;files.push({name:fn,data:u8});pm.push({pid:p.pid,ref:p.ref,file:fn,crc:crc32(u8),ts:p.ts})}
  const jd=enc.encode(JSON.stringify({...r,foto:pm,skema:FORMS[r.form]},null,1));const jn=`data/${r.id}.json`;files.push({name:jn,data:jd});man.items.push({id:r.id,gardu:r.gardu.nama,form:r.form,rev:r.rev,tanggal:r.tanggal,data:jn,crc:crc32(jd),jumlah_foto:pm.length})}
 files.unshift({name:'manifest.json',data:enc.encode(JSON.stringify(man,null,1))});return makeZip(files)}
async function kirim(recs){try{
 // BLOKIR: gardu non-TM tanpa ukur beban trafo yang selesai tidak boleh dikirim
 const held=recs.filter(r=>r.form!=='beban'&&!r.tm&&!bebanOk(r.gardu.id));
 if(held.length){const names=held.slice(0,8).map(r=>r.gardu.nama).join(', ')+(held.length>8?', …':'');const rest=recs.filter(r=>!held.includes(r));
  if(!rest.length){if(confirm('TIDAK BISA DIKIRIM: ukur beban trafo belum diisi untuk '+names+'.\n\nIsi ukur beban sekarang?'))return openGardu(tugasOf(held[0]),'beban');return}
  if(!confirm('DITAHAN (ukur beban trafo belum diisi): '+names+'.\n\nKirim '+rest.length+' inspeksi lainnya sekarang?'))return;recs=rest}const blob=await buildPackage(recs);const d=new Date();const stamp=today().replace(/-/g,'')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');const fn=`paket-${slug(S.petugas||'petugas')}-${stamp}.zip`;const file=new File([blob],fn,{type:'application/zip'});
 let shared=false;if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});shared=true}catch(e){if(e.name==='AbortError')return}}
 if(!shared){const a=h('a',{href:URL.createObjectURL(blob),download:fn});document.body.append(a);a.click();a.remove()}
 if(confirm('Paket sudah dibuat ('+fn+'). Tandai '+recs.length+' inspeksi sebagai terkirim?')){for(const r of recs){r.sentAt=new Date().toISOString();await saveRec(r)}}renderHome()}catch(e){alert('Gagal membuat paket: '+e.message)}}

/* ================= start ================= */
openDB().then(()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();return renderHome()}).catch(e=>{app.textContent='Gagal membuka penyimpanan lokal: '+e.message+' (jangan pakai mode private/incognito).'});
</script>
